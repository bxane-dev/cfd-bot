name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Python regression tests
        run: python -m unittest discover -s tests -p "test_*.py"

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run dashboard tests
        run: node --test tests/*.test.mjs


  windows-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Build Windows desktop app
        shell: cmd
        run: BUILD_APP.bat
      - name: Verify release output
        shell: powershell
        run: |
          if (!(Test-Path "release")) { throw "release folder missing" }
          $files = Get-ChildItem release -File -Recurse
          if (-not ($files | Where-Object { $_.Name -match "\.exe$" })) {
            throw "No Windows EXE produced"
          }
