mode: demo  # demo | live  (Capital.com)
desk: strategy-market-21

execution:
  # Runtime efficiency: retry temporary same-bar blockers at a controlled
  # cadence and fetch a smaller candle payload for non-VWAP strategies.
  retry_scan_seconds: 15
  runtime_lookback_bars: 180

  # Scan all 21 configured strategy/market pairs. Orders are only submitted
  # when the assigned strategy and the existing quality/risk gates qualify.
  demo_market_scope: all
  demo_frequency:
    strategy:
      ema_pullback:
        slope_bars: 4
        rsi_period: 14
        rsi_lo: 30
        rsi_hi: 70
        touch_atr: 0.35
      rsi_reversion:
        period: 14
        oversold: 30
        overbought: 70
        slope_bars: 8
        max_slope_atr: 1.0
      donchian:
        length: 20
        min_atr_move: 0.10
      orb:
        minutes: 15
        expire_minutes: 120
    news:
      min_confidence: 0.68
    streamers:
      majority_threshold: 0.67
    quality:
      min_reward_risk: 1.00
      max_spread_stop_ratio: 0.25
      predictor_opposite_p: 0.68
      predictor_opposite_edge: 0.05

# One market assignment per registered strategy. All 21 are eligible for
# scanning in both DEMO and LIVE; broker availability is verified at startup.
markets:
